# Bibliagraphia: FastAPI backend + React/Vite frontend, run locally together.
#
# Two containers:
#   - api:      the FastAPI JSON API (app/api.py) on port 8000.
#   - frontend: nginx serving the built React app, proxying /search /graph etc.
#               to the api service. Exposed on the host at :8080.
#
#   docker compose up -d --build
#   open http://localhost:8080
#
# The api image embeds the DuckDB graph (build_db.py runs at image build time),
# so no host volume is mounted. This avoids the rootless-Podman PermissionError
# you get when mounting a host-owned ./data dir into the container.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bibliagraphia-api
    # Internal API port. Exposed on the host too so you can hit it directly
    # while debugging: http://localhost:8000/docs
    ports:
      - "8000:8000"
    # No volumes: the image already contains /app/data/bible.db.
    environment:
      - BIBLE_DB_PATH=/app/data/bible.db
      - BIBLE_DATA_DIR=/app/data
      # Verse-explanation feature (GET /explain, explain_verse MCP tool):
      # forwarded from the host; unset values fall back to app defaults.
      - FAITHTECH_API_KEY=${FAITHTECH_API_KEY:-}
      - FAITHTECH_API_BASE=${FAITHTECH_API_BASE:-}
      - FAITHTECH_MODEL=${FAITHTECH_MODEL:-}
      - FAITHTECH_TIMEOUT=${FAITHTECH_TIMEOUT:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bibliagraphia-frontend
    # Single entry point for the app: nginx serves the SPA and proxies API.
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
