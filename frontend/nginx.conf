# Bibliagraphia frontend nginx config (an envsubst TEMPLATE).
#
# The official nginx image entrypoint (20-envsubst-on-templates.sh) replaces
# ${BACKEND_URL} and ${DNS_RESOLVER} from the container environment at start
# and writes /etc/nginx/conf.d/default.conf. nginx's own $-variables
# ($upstream, $host, ...) are not environment variables, so envsubst leaves
# them alone.
#
# The SPA is served as static files; API routes are proxied to the FastAPI
# backend container. The API has no /api prefix, so we list the known route
# prefixes explicitly and let everything else fall through to the SPA.
#
# WHY $upstream + resolver instead of a literal proxy_pass: nginx resolves a
# literal upstream hostname ONCE at config load and exits with [emerg] if it
# does not resolve yet (e.g. the backend service is still deploying and its
# private DNS entry has not propagated). With a variable, nginx resolves per
# request via the resolver, so an unreachable backend yields 502s that
# self-heal the moment it comes up.
#
# NOTE: This is the nginx:alpine image, which has NO /etc/nginx/proxy_params
# (that file is an Ubuntu/Debian nginx convention). Proxy headers are inlined.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The container's nameserver (substituted at start from /etc/resolv.conf
    # by the start.sh entrypoint wrapper; IPv6 gets bracketed there).
    # Re-resolve every 5s so a backend that appears later is picked up
    # quickly.
    resolver ${DNS_RESOLVER} valid=5s;

    # The backend upstream, substituted from BACKEND_URL (scheme included —
    # start.sh normalises it: bare host:port gets http:// prepended).
    set $upstream "${BACKEND_URL}";

    # HTTPS upstreams (e.g. the api's public Railway domain): send SNI so the
    # edge terminates TLS for the right hostname.
    proxy_ssl_server_name on;

    location /mcp {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ---- JSON API routes -> FastAPI backend -----------------------------------
    location /health {
        proxy_pass $upstream;
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /search {
        proxy_pass $upstream;
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /traverse {
        proxy_pass $upstream;
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /path {
        proxy_pass $upstream;
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /graph {
        proxy_pass $upstream;
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # /map is also a client-side page route; only its API subpaths belong
    # to FastAPI.
    location = /map {
        try_files /index.html =404;
    }
    location ^~ /map/ {
        proxy_pass $upstream;
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /verse {
        proxy_pass $upstream;
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /chapter {
        proxy_pass $upstream;
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /reader {
        proxy_pass $upstream;
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # The verse explainer shells out to an external LLM (and retries once
    # when the model exhausts its budget), so it can run past nginx's
    # 60s default read timeout.
    location /explain {
        proxy_pass $upstream;
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout 300s;
    }
    location /place/ {
        proxy_pass $upstream;
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Single-page app -------------------------------------------------------
    # Serve static assets directly; fall back to index.html for SPA client-side
    # routes (e.g. / and /read). nginx picks the longest matching prefix above
    # first, so /search, /graph, etc. never reach this block.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
